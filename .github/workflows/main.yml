name: Build and Lint
on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Node $
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: |
            /home/runner/work/Audio4Live/Audio4Live/node_modules
            /home/runner/work/Audio4Live/Audio4Live/functions/node_modules
          key: ${{ runner.os }}-npm

      - name: Cache Angular build cache
        uses: actions/cache@v6
        with:
          path: /home/runner/work/Audio4Live/Audio4Live/.angular/cache
          key: ${{ runner.os }}-angular

      - name: Install dependencies (Frontend)
        run: npm ci

      - name: Install dependencies (Functions)
        working-directory: ./functions
        run: npm ci

      - name: build (Frontend)
        run: npx ng build --configuration production

      - name: lint (Frontend)
        continue-on-error: true
        run: npx ng lint

      - name: build (Functions)
        working-directory: ./functions
        run: npm run build

      - name: lint (Functions)
        working-directory: ./functions
        continue-on-error: true
        run: npm run lint

  e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore emulator runs on the JVM.
      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies (Frontend)
        run: npm ci

      - name: Install dependencies (Functions)
        working-directory: ./functions
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Boots the Firebase emulators and `ng serve` itself, see playwright.config.ts.
      - name: e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
